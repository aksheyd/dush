name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: extractions/setup-just@v4

      - name: brew install atf kyua coreutils
        run: brew install atf kyua coreutils

      - name: just checks
        run: just checks

      - name: just frozen-bsd
        if: ${{ !cancelled() }}
        run: just frozen-bsd

      - name: just frozen-gnu
        if: ${{ !cancelled() }}
        run: just frozen-gnu

      - name: frozen-gnu log
        if: ${{ failure() }}
        run: cat zig-out/logs/frozen-gnu.log

      - name: just upstream-bsd
        if: ${{ !cancelled() }}
        run: just upstream-bsd

      - name: just upstream-gnu
        if: ${{ !cancelled() }}
        run: just upstream-gnu

      - name: just fuzz-selftest
        if: ${{ !cancelled() }}
        run: just fuzz-selftest

      - name: just fuzz
        if: ${{ !cancelled() }}
        run: just fuzz
