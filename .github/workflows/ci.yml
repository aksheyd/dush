name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: extractions/setup-just@v4

      - name: brew install atf kyua coreutils
        run: brew install atf kyua coreutils

      - name: just checks
        run: just checks

      - name: cache lean toolchain and proof build
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            proofs/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('proofs/lean-toolchain', 'proofs/lakefile.toml', 'proofs/lake-manifest.json') }}-${{ hashFiles('proofs/**/*.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('proofs/lean-toolchain', 'proofs/lakefile.toml', 'proofs/lake-manifest.json') }}-

      - name: just proof
        if: ${{ !cancelled() }}
        run: |
          if ! command -v elan >/dev/null && [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          just proof

      - name: just frozen-bsd
        if: ${{ !cancelled() }}
        run: just frozen-bsd

      - name: just frozen-gnu
        if: ${{ !cancelled() }}
        run: just frozen-gnu

      - name: frozen-gnu log
        if: ${{ failure() }}
        run: cat zig-out/logs/frozen-gnu.log

      - name: just upstream-bsd
        if: ${{ !cancelled() }}
        run: just upstream-bsd

      - name: just upstream-gnu
        if: ${{ !cancelled() }}
        run: just upstream-gnu

      - name: just fuzz-selftest
        if: ${{ !cancelled() }}
        run: just fuzz-selftest

      - name: just fuzz
        if: ${{ !cancelled() }}
        run: just fuzz
